<!doctype html><meta charset="utf-8"><title>Cena · orbe</title>
<script type="module">
import { Scene } from './_lib.js';
// Orbe de luz âmbar: núcleo branco-quente, corpo em brasa com turbulência,
// coroa de raios girando devagar. Composição levemente à direita (o texto do herói fica à esquerda).
Scene({ loop: 12, fragment: `
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec2 c=vec2(.28*uRes.x/uRes.y*.55,.04);
  vec2 p=(uv-c)/.95;
  float d=length(p), a=atan(p.y,p.x);
  float P=4.;
  vec2 q=vec2(pfbm(vec3(p*2.2,uPhase*P),P,5), pfbm(vec3(p*2.2+5.2,uPhase*P+1.3),P,5));
  float w=pfbm(vec3(p*1.7+q*1.8,uPhase*P*2.),P*2.,5);
  // raios: ruído angular periódico (8 setores) girando com a fase
  vec2 ang=vec2(cos(a),sin(a));
  float rays=pfbm(vec3(ang*2.6+q*1.2, d*1.4+uPhase*P),P,4);
  float body=smoothstep(.36,.0,d+(w-.5)*.2);
  float core=exp(-d*d*42.);
  float corona=exp(-d*2.3)*(.35+.9*rays);
  float haze=exp(-d*.9)*.25;
  vec3 col=NOITE;
  col+=BRASA*haze*.5;
  col+=BRASA*corona*.42;
  col+=mix(BRASA,LUME,w)*body*1.05;
  col+=HALO*pow(body,2.6)*.6;
  col+=NUCLEO*core*.95;
  // vinheta e tom
  col*=1.-smoothstep(.5,1.4,length(uv*vec2(.75,1.)))*.55;
  col=1.-exp(-col*1.25);
  gl_FragColor=vec4(col,1.);
}` });
</script>
